<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Color Theory</title>
        <meta charset-="UTF-8">
         <style>
           h1{
             text-align: center;   
           }
          .Complementary{
                        color:white;
                        text-align: center;
                        width:25%;
                        background-color:blue ;
                         border: inset 10px orange;
          }
          .Analogous{
                color:orange;
                width:50%;
                text-align:center;
                background-color:green;
                border: inset 20px yellow;
          }
          .Triadic{
                width:100%;
                text-align:center;
                color:green;
                background-color: red;
                border: inset 40px rgba(0, 0, 255, 0.815);
          }
        </style>
    </head>
    <body>
        <h1>Color Theory</h1>
        <div class="Complementary">
       <p>
        Complementary
       </p>
       </div>
       <div class="Analogous">
       <p>
        Analogous
       </p>
       </div>
       <div class="Triadic">
       <p>
        Triadic
       </p>
       </div>
    </body>
</html>
